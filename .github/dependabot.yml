version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      homeassistant:
        patterns:
          - homeassistant
          - pytest-homeassistant
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
