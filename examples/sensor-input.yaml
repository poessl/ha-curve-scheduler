# Merge into an isolated development HA configuration.
# Move this helper to simulate the input to a heating curve.
input_number:
  curve_outdoor_temperature:
    name: Curve example outdoor temperature
    min: -20
    max: 40
    step: 0.5
    initial: 10
    unit_of_measurement: °C

template:
  - sensor:
      - name: Curve example outdoor temperature
        unique_id: curve_example_outdoor_temperature
        unit_of_measurement: °C
        device_class: temperature
        state: "{{ states('input_number.curve_outdoor_temperature') }}"
        availability: "{{ is_number(states('input_number.curve_outdoor_temperature')) }}"

# Add Curve Scheduler using the UI, following README's sensor-input example.
# This file creates only the input; integration entries are created by HA's UI.
